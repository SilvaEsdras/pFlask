{% include 'cabecalho.html' %}
{% include 'menu.html' %}

<h1 class="mb-4">{{ 'Editar Professor' if professor else 'Cadastrar Professor' }}</h1>

<form action="/professor/salvar/{{ professor[0] if professor else '' }}" method="POST">
    
    <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" value="{{ professor[1] if professor else '' }}" required>
    </div>
    
    <div class="mb-3">
        <label for="disciplina" class="form-label">Disciplina</label>
        <select class="form-select" id="disciplina" name="disciplina" required>
            <option value="" disabled {{ 'selected' if not professor }}>Selecione uma disciplina...</option>
            <option value="Matemática" {{ 'selected' if professor and professor[2] == 'Matemática' }}>Matemática</option>
            <option value="Português" {{ 'selected' if professor and professor[2] == 'Português' }}>Português</option>
            <option value="Biologia" {{ 'selected' if professor and professor[2] == 'Biologia' }}>Biologia</option>
            <option value="Informática" {{ 'selected' if professor and professor[2] == 'Informática' }}>Informática</option>
            <option value="Banco de Dados" {{ 'selected' if professor and professor[2] == 'Banco de Dados' }}>Banco de Dados</option>
        </select>
    </div>
    
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/professor" class="btn btn-secondary">Cancelar</a>
    </div>
</form>

{% include 'rodape.html' %}
